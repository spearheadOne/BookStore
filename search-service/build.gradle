// Match the HTTP transport versions required by the OpenSearch Java client.
ext["httpclient5.version"] = "5.6.4"
ext["httpcore5.version"] = "5.4.3"

dependencies {
    implementation("org.opensearch.client:opensearch-java:3.10.0")
    testImplementation("org.testcontainers:testcontainers-kafka")

    constraints {
        add("implementation", "org.eclipse.parsson:parsson:1.1.8") {
            because("Fix CVE-2026-9563 in the OpenSearch client's transitive JSON parser")
        }
    }
}

bootBuildImage {
    imageName = "abondar/bookstore-search-service:${project.version}"
    builder = "paketobuildpacks/builder-noble-java-tiny:latest"
    runImage = "paketobuildpacks/ubuntu-noble-run-tiny:latest"
    buildpacks = [
            "docker.io/paketobuildpacks/adoptium:latest",
            "docker.io/paketobuildpacks/java:latest"
    ]
    environment = [
            "BP_JVM_VERSION": java.toolchain.languageVersion.get().asInt().toString(),
            "BP_JVM_TYPE"   : "JRE"
    ]
    publish = false
}
