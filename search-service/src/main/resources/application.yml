server:
  port: ${SERVER_PORT:8082}

book:
  content:
    # Reject oversized extracted text; never index a silently truncated book.
    max-extracted-characters: ${BOOK_CONTENT_MAX_EXTRACTED_CHARACTERS:10000000}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:book-search}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bookstore}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bookstore}/protocol/openid-connect/certs}
          audiences:
            - ${KEYCLOAK_AUDIENCE:book-search}

opensearch:
  url: ${OPENSEARCH_URL:http://localhost:9200}
  username: ${OPENSEARCH_USERNAME:}
  password: ${OPENSEARCH_PASSWORD:}
  connect-timeout: ${OPENSEARCH_CONNECT_TIMEOUT:1s}
  response-timeout: ${OPENSEARCH_RESPONSE_TIMEOUT:10s}
  book-metadata-index: ${OPENSEARCH_BOOK_INDEX:book-metadata}
  book-content-index: ${OPENSEARCH_BOOK_CONTENT_INDEX:book-content}
  catalog-index: ${OPENSEARCH_CATALOG_INDEX:catalog}
  shards: ${OPENSEARCH_SHARDS:1}
  replicas: ${OPENSEARCH_REPLICAS:0}


topic:
  book-topic: ${BOOK_TOPIC:bookstore.book-events}
  catalog-topic: ${CATALOG_TOPIC:bookstore.catalog-events}
  dlt-prefix: ${DLT_PREFIX:.DLT}
  backoff-interval: ${BACKOFF_INTERVAL:1000}
  max-attempts: ${MAX_ATTEMPTS:3}

s3:
  endpoint: ${BOOK_S3_ENDPOINT:}
  bucket: ${BOOK_S3_BUCKET:book-store}
  region: ${BOOK_S3_REGION:us-east-1}
  path-style: ${BOOK_S3_PATH_STYLE:false}
  connect-timeout: ${BOOK_S3_CONNECT_TIMEOUT:1s}
  request-timeout: ${BOOK_S3_REQUEST_TIMEOUT:2m}

springdoc:
  swagger-ui:
    url: /openapi.yaml

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          show-details: always
      show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,UP
  server:
    port: ${MANAGEMENT_SERVER_PORT:8002}

resilience4j:
  ratelimiter:
    instances:
      reads:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
      writes:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0s

keycloak:
  health:
    # Optional network address for discovery; JWT issuer validation remains unchanged.
    discovery-uri: ${KEYCLOAK_HEALTH_DISCOVERY_URI:}
