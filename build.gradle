plugins {
    id "base"
    id "org.springframework.boot" version "4.0.6" apply false
    id "io.spring.dependency-management" version "1.1.7" apply false
    id "org.openapi.generator" version "7.26.0" apply false
    id "com.diffplug.spotless" version "8.10.4" apply false
}

group "org.abondar.experimental.bookstore"
version "0.0.1"

def serviceProjects = [
        project(":book-service")
]

configure(serviceProjects) {
    apply plugin: "java"
    apply plugin: "idea"
    apply plugin: "org.springframework.boot"
    apply plugin: "io.spring.dependency-management"
    apply plugin: "org.openapi.generator"
    apply plugin: "com.diffplug.spotless"

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    sourceSets.main.java.srcDir(layout.buildDirectory.dir("generated-src/openapi/src/main/java"))

    spotless {
        enforceCheck true
        java {
            target "src/**/*.java"
            googleJavaFormat("1.36.1")
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation("org.springframework.boot:spring-boot-starter-validation")
        implementation("org.springframework.boot:spring-boot-starter-actuator")
        implementation("org.springframework.boot:spring-boot-starter-webmvc")
        implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3")
        implementation("org.springframework.boot:spring-boot-starter-security-oauth2-resource-server")
        implementation("io.github.resilience4j:resilience4j-spring-boot4:2.4.0")
        implementation("org.springframework.boot:spring-boot-starter-kafka")
        implementation(project(":event-contracts"))

        compileOnly("org.projectlombok:lombok")
        annotationProcessor("org.projectlombok:lombok")

        testImplementation("org.springframework.boot:spring-boot-starter-test")
        testImplementation("org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test")

        testImplementation("org.springframework.boot:spring-boot-testcontainers")
        testImplementation(platform("org.testcontainers:testcontainers-bom:2.0.2"))
        testImplementation("org.testcontainers:testcontainers-junit-jupiter")

        testCompileOnly("org.projectlombok:lombok")
        testAnnotationProcessor("org.projectlombok:lombok")
    }

    tasks.named("processResources") {
        from(layout.projectDirectory.file("src/main/openapi/openapi.yaml")) {
            into("static")
        }
    }

    def generatedApiPackage = "${project.group}.adapter.in.generated.${project.name.replace('-', '')}"
    openApiGenerate {
        generatorName.set("spring")
        inputSpec.set(layout.projectDirectory.file("src/main/openapi/openapi.yaml"))
        outputDir.set(layout.buildDirectory.dir("generated-src/openapi"))
        apiPackage.set("${generatedApiPackage}.api")
        modelPackage.set("${generatedApiPackage}.model")
        invokerPackage.set("${generatedApiPackage}.support")
        configOptions.set([
                interfaceOnly        : "true",
                skipDefaultInterface : "true",
                useSpringBoot4       : "true",
                useJackson3          : "true",
                annotationLibrary    : "none",
                documentationProvider: "none",
                openApiNullable      : "false",
                useBeanValidation: "true",
                useTags         : "true",
                generateBuilders: "true"
        ])
        globalProperties.set([
                apis           : "",
                models         : "",
                supportingFiles: "false",
                apiDocs        : "false",
                modelDocs      : "false",
                apiTests       : "false",
                modelTests     : "false"
        ])
    }

    tasks.named("compileJava") {
        dependsOn(tasks.named("openApiGenerate"))
    }

    tasks.named("test") {
        useJUnitPlatform()
    }

}

tasks.named("build") {
    dependsOn(
            ":book-service:build",
            ":event-contracts:build"
    )
}

tasks.register("test") {
    group = "verification"
    description = "Runs tests for all Gradle subprojects."
    dependsOn(
            ":book-service:test",
            ":event-contracts:test"
    )
}
