services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: book-service-keycloak
    restart: unless-stopped
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: book_auth
      KC_BOOTSTRAP_ADMIN_PASSWORD: book_auth_pwd
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - book_store_keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/bookstore-realm.json:/opt/keycloak/data/import/bookstore-realm.json:ro
  postgres:
    image: postgres:17-alpine
    container_name: book-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_pass
    ports:
      - "5432:5432"
    volumes:
      - book_store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U book_user -d bookstore" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    ports:
      - "6379:6379"
    image: redis:8.4-alpine
    container_name: book-service-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: book-service-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: book_admin
      AWS_SECRET_ACCESS_KEY: book_secret
      S3_BUCKET: book-store
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - book_store_seaweedfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:8333/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  kafka:
    image: apache/kafka:4.3.2
    container_name: book-service-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "HOST://:9092,INTERNAL://:19092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9092,INTERNAL://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - book_store_kafka_data:/var/lib/kafka/data
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"



volumes:
  book_store_keycloak_data:
  book_store_postgres_data:
  book_store_seaweedfs_data:
  book_store_kafka_data:
