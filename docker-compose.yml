services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: book-service-keycloak
    restart: unless-stopped
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: book_auth
      KC_BOOTSTRAP_ADMIN_PASSWORD: book_auth_pwd
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - book_store_keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/bookstore-realm.json:/opt/keycloak/data/import/bookstore-realm.json:ro
  postgres:
    image: postgres:17-alpine
    container_name: book-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_pass
    ports:
      - "5432:5432"
    volumes:
      - book_store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U book_user -d bookstore" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    ports:
      - "6379:6379"
    image: redis:8.4-alpine
    container_name: book-service-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  book_store_keycloak_data:
  book_store_postgres_data:
