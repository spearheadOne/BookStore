services:
  postgres:
    image: postgres:17-alpine
    container_name: book-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: book_pass
    ports:
      - "5432:5432"
    volumes:
      - book_store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U book_user -d bookstore" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  book_store_postgres_data: