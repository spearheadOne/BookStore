spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookstore}}
    username: ${DB_USERNAME:book_user}
    password: ${DB_PASSWORD:book_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

store:
  cache:
    book-ttl: ${BOOK_CACHE_TTL:30s}
    author-ttl: ${AUTHOR_ID_CACHE_TTL:30s}
    catalog-ttl: ${CATALOG_TTL:30s}
