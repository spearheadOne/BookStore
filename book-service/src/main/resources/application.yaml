spring:
  servlet:
    multipart:
      max-file-size: ${BOOK_CONTENT_MAX_FILE_SIZE:100MB}
      max-request-size: ${BOOK_CONTENT_MAX_REQUEST_SIZE:110MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookstore}}
    username: ${DB_USERNAME:book_user}
    password: ${DB_PASSWORD:book_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bookstore}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bookstore}/protocol/openid-connect/certs}
          audiences:
            - ${KEYCLOAK_AUDIENCE:book-service}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer


management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          show-details: always
      show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,UP
  server:
    port: ${MANAGEMENT_SERVER_PORT:8001}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    url: /openapi.yaml

resilience4j:
  ratelimiter:
    instances:
      reads:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
      writes:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0s

store:
  cache:
    book-ttl: ${BOOK_CACHE_TTL:30s}
    author-ttl: ${AUTHOR_ID_CACHE_TTL:30s}
    catalog-ttl: ${CATALOG_TTL:30s}
  topic:
    book-topic: ${BOOK_TOPIC:bookstore.book-events}
    catalog-topic: ${CATALOG_TOPIC:bookstore.catalog-events}

s3:
  endpoint: ${BOOK_S3_ENDPOINT:}
  bucket: ${BOOK_S3_BUCKET:book-store}
  region: ${BOOK_S3_REGION:us-east-1}
  path-style: ${BOOK_S3_PATH_STYLE:false}
  connect-timeout: ${BOOK_S3_CONNECT_TIMEOUT:1s}
  request-timeout: ${BOOK_S3_REQUEST_TIMEOUT:2m}
