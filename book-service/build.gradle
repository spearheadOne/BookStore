plugins {
    id "org.jooq.jooq-codegen-gradle" version "3.19.32"
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-liquibase")

    implementation("org.springframework.boot:spring-boot-starter-jooq")
    implementation("org.springframework.boot:spring-boot-starter-data-redis")

    implementation(platform("software.amazon.awssdk:bom:2.57.4"))
    implementation("software.amazon.awssdk:s3")
    implementation("software.amazon.awssdk:apache5-client")

    runtimeOnly("org.postgresql:postgresql")

    jooqCodegen("org.postgresql:postgresql")

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-data-redis-test")
    testImplementation("org.testcontainers:testcontainers-postgresql")
    testImplementation("org.testcontainers:testcontainers-kafka")
}

sourceSets {
    main {
        java.srcDir(layout.buildDirectory.dir("generated-src/jooq/main"))
    }
}

bootBuildImage {
    imageName = "abondar/bookstore-book-service:${project.version}"
    builder = "paketobuildpacks/builder-noble-java-tiny:latest"
    runImage = "paketobuildpacks/ubuntu-noble-run-tiny:latest"
    buildpacks = [
            "docker.io/paketobuildpacks/adoptium:latest",
            "docker.io/paketobuildpacks/java:latest"
    ]
    environment = [
            "BP_JVM_VERSION": "25",
            "BP_JVM_TYPE"   : "JRE"
    ]
    publish = false
}

def dbHost = System.getenv("DB_HOST") ?: "localhost"
def dbPort = System.getenv("DB_PORT") ?: "5432"
def dbName = System.getenv("DB_NAME") ?: "bookstore"

jooq {
    configuration {
        jdbc {
            driver = "org.postgresql.Driver"
            url = System.getenv("DB_URL") ?: "jdbc:postgresql://${dbHost}:${dbPort}/${dbName}"
            user = System.getenv("DB_USERNAME") ?: "book_user"
            password = System.getenv("DB_PASSWORD") ?: "book_pass"
        }

        generator {
            database {
                name = "org.jooq.meta.postgres.PostgresDatabase"
                inputSchema = "public"
                includes = "book|author|book_author|catalog"
            }

            target {
                packageName = "org.abondar.experimental.bookstore.adapter.out.persistence.generated"
                directory = project.layout.buildDirectory.dir("generated-src/jooq/main").get().asFile.absolutePath
            }
        }
    }
}
